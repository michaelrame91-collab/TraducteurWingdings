<!DOCTYPE html>

<meta charset="UTF-8" />

<title>Traducteur Wingdings</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  background:white;
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  border-bottom:1px solid #ddd;
}

.container{
  flex:1;
  display:flex;
  gap:1px;
  background:#ccc;
}

textarea{
  width:50%;
  border:none;
  resize:none;
  padding:15px;
  font-size:18px;
  outline:none;
}

#input{
  background:white;
}

#output{
  background:#fafafa;
  font-family:"Segoe UI Symbol","Arial Unicode MS",sans-serif;
}

.controls{
  background:white;
  padding:10px;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:center;
}

button{
  padding:10px 18px;
  border:none;
  background:#111;
  color:white;
  border-radius:6px;
  cursor:pointer;
  font-size:16px;
}

button:hover{
  background:#333;
}

@media(max-width:700px){
  .container{
    flex-direction:column;
  }

  textarea{
    width:100%;
    height:50%;
  }
}
</style>
</head>

<body>

<header>Traducteur Wingdings</header>

<div class="container">
  <textarea id="input" placeholder="Écris ici..."></textarea>

  <textarea
    id="output"

</div>

<div class="controls">
  <button id="copyBtn">Copier la traduction</button>

const input = document.getElementById("input");
const output = document.getElementById("output");
const copyBtn = document.getElementById("copyBtn");

function translate(text){
  return [...text]
    .map(char => map[char] || char)
    .join("");
}

input.addEventListener("input", () => {
  output.value = translate(input.value);
});

copyBtn.addEventListener("click", async () => {
  try{
    await navigator.clipboard.writeText(output.value);
    copyBtn.textContent = "Copié !";

    setTimeout(() => {
      copyBtn.textContent = "Copier la traduction";
    }, 1500);

  }catch(err){

});
